[project]
name = "fusionwam"
version = "0.2.0"
description = "Tri-expert fusion: PaliGemma (semantics) + Wan2.2 video DiT (dynamics) + action DiT (flow matching). Self-contained."
requires-python = ">=3.10"
dependencies = [
    # Core (versions follow the vendored wam training stack)
    "torch>=2.7,<2.8",
    "torchvision>=0.22,<0.23",
    "accelerate==1.12.0",
    "deepspeed==0.18.5",
    "transformers==4.49.0",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "numpy==1.26.4",
    "einops==0.8.1",
    "safetensors==0.5.3",
    "sentencepiece",
    "pyyaml",
    # Dataset / video decoding
    "datasets==3.6.0",
    "av==16.0.1",
    "torchcodec==0.5",
    "pandas==2.2.3",
    "pyarrow==23.0.0",
    "imageio==2.37.0",
    "imageio-ffmpeg==0.6.0",
    "jsonlines==4.0.0",
    "pillow>=10",
    # Weight download backends (Wan-AI base auto-fetches on first run)
    "huggingface-hub>=0.29",
    "modelscope==1.34.0",
    # Misc upstream requirements
    "wandb==0.23.1",
    "rich",
    "termcolor",
    "tqdm",
    "regex",
    "packaging",
]

# NOTE: upstream pins torch==2.7.1+cu128 via the PyTorch cu128 index. The
# default PyPI wheels bundle CUDA and work on most machines; pin the +cu128
# build only if your cluster requires it:
#   uv pip install torch==2.7.1+cu128 torchvision==0.22.1+cu128 \
#       --extra-index-url https://download.pytorch.org/whl/cu128

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["fusionwam*"]
