# FusionWAM stage 1: frozen backbones, train action expert + fusion adapter.
#
# `fusion:` keys are injected into cfg.model (consumed by
# FusionWAM.from_wan22_pretrained); `train:` keys override top-level trainer
# config after WAM's hydra tree is composed. Everything else (task, data,
# optimizer, model geometry) comes from WAM's own configs — pass the same
# `task=... model=...` overrides you would pass scripts/train.py upstream.

fusion:
  vlm_path: ./checkpoints/paligemma-3b-pt-224
  p_drop_vlm: 0.3          # source dropout: action must survive without VLM
  p_drop_video: 0.3        # ...and without video KV (Gate-1/B2 lesson)
  vlm_layerscale_init: 1.0e-3

train:
  max_steps: 20000
  save_every: 1000
  # Weights-only checkpointing: a full accelerate state save needs a 2x13G
  # transient window (2026-08-09 disk incident). Enable full state only on
  # machines with >30G free on the checkpoint volume.
  save_full_state: false

# Acceptance evaluation (not consumed by train.py — protocol contract):
#   dose displacement scan {0,4,7,10,15}cm, n=30/cell, zero-dose control,
#   feasibility-adjusted far cells. See eval/README.md for the decision rule.
